<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/icenine_avatar_32px.png"
        />
        <link rel="apple-touch-icon" href="/icenine_avatar_180px.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Joe Chilen // IceNine</title>
        <script>
            try {
                const saved = localStorage.getItem('theme')
                const theme =
                    saved === 'light' || saved === 'dark'
                        ? saved
                        : matchMedia('(prefers-color-scheme: dark)').matches
                          ? 'dark'
                          : 'light'
                document.documentElement.classList.add(theme)
            } catch {}
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
